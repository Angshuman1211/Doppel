
apiVersion: batch/v1
kind: Job
metadata:
  name: doppel-ctgan
  namespace: doppel
  labels:
    project: doppel
    component: generation
    generator: ctgan
    track: track4
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: doppel-ctgan
        project: doppel
        component: generation
    spec:
      restartPolicy: Never
      containers:
        - name: ctgan-generator
          image: doppel/ctgan:0.1
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -m
            - generators.generate
            - --generator
            - ctgan
            - --seed
            - "42"
            # The configuration Track 1's tuning selected (ADR-029), not the epochs=1 smoke value.
            - --param
            - epochs=300
            - --param
            - embedding_dim=32
            - --param
            - generator_dim=[64,64]
            - --param
            - discriminator_dim=[64,64]
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: shared-storage
              mountPath: /app/output
              subPath: output
      volumes:
        - name: shared-storage
          persistentVolumeClaim:
            claimName: doppel-shared-pvc
