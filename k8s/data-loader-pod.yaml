apiVersion: v1
kind: Pod
metadata:
  name: doppel-data-loader
  namespace: doppel
spec:
  restartPolicy: Never
  containers:
    - name: loader
      image: busybox:1.36
      command: ["sh", "-c", "mkdir -p /shared/output/synthetic /shared/results && sleep 36000"]
      volumeMounts:
        - name: shared-storage
          mountPath: /shared
  volumes:
    - name: shared-storage
      persistentVolumeClaim:
        claimName: doppel-shared-pvc
