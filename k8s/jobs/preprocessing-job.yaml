apiVersion: batch/v1
kind: Job
metadata:
  name: doppel-preprocessing
  namespace: doppel
  labels:
    project: doppel
    component: data-engineering
    track: track3
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: doppel-preprocessing
        project: doppel
        component: data-engineering
    spec:
      restartPolicy: Never
      containers:
        - name: preprocessing
          image: doppel/preprocessing:0.1
          imagePullPolicy: IfNotPresent
          env:
            - name: RAW_DIR
              value: /app/raw
            # Dataset version gate: validate_dataset.py fails the Job if the CSV this
            # Job writes does not hash to this value. Change it only when the dataset
            # is meant to change, and rerun everything that was produced from it.
            - name: EXPECTED_DATASET_SHA256
              value: "9e263f45fd4fa9ed7c1b53b656c77aceef84eda9162819730a6dcafbc26ad83e"
          command: ["sh", "-c"]
          args:
            - python preprocess_mimic_demo.py && python generate_manifest.py && python validate_dataset.py
          volumeMounts:
            - name: shared-storage
              mountPath: /app/raw
              subPath: raw
              readOnly: true
            - name: shared-storage
              mountPath: /app/output
              subPath: output
      volumes:
        - name: shared-storage
          persistentVolumeClaim:
            claimName: doppel-shared-pvc