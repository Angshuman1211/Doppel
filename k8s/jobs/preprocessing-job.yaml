apiVersion: batch/v1
kind: Job
metadata:
  name: doppel-preprocessing
  namespace: doppel
  labels:
    project: doppel
    component: data-engineering
    track: track3
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: doppel-preprocessing
        project: doppel
        component: data-engineering
    spec:
      restartPolicy: Never
      containers:
        - name: preprocessing
          image: doppel/preprocessing:0.1
          imagePullPolicy: IfNotPresent
          env:
            - name: RAW_DIR
              value: /app/raw
          command: ["sh", "-c"]
          args:
            - python preprocess_mimic_demo.py && python generate_manifest.py && python validate_dataset.py
          volumeMounts:
            - name: shared-storage
              mountPath: /app/raw
              subPath: raw
              readOnly: true
            - name: shared-storage
              mountPath: /app/output
              subPath: output
      volumes:
        - name: shared-storage
          persistentVolumeClaim:
            claimName: doppel-shared-pvc